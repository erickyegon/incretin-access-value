<text x='5.48' y='61.71' style='font-size: 11.00px;fill: #444444; font-family: "Arial";' textLength='627.27px' lengthAdjust='spacingAndGlyphs'>Callaway-Sant'Anna dynamic ATT, 10 primary states vs never- and not-yet-treated states, 2018 Q1 to 2025 Q3; 20 imputations of</text>
<text x='5.48' y='73.59' style='font-size: 11.00px;fill: #444444; font-family: "Arial";' textLength='635.44px' lengthAdjust='spacingAndGlyphs'>suppressed cells combined with Rubin's rules. Shaded band and points: pointwise 95% CI; numbers along the bottom: contributing</text>
<text x='5.48' y='85.47' style='font-size: 11.00px;fill: #444444; font-family: "Arial";' textLength='366.56px' lengthAdjust='spacingAndGlyphs'>treated states; event times with fewer than 3 contributing states are greyed.</text>
<text x='5.48' y='16.97' style='font-size: 14.00px; font-weight: bold;fill: #222222; font-family: "Arial";' textLength='655.39px' lengthAdjust='spacingAndGlyphs'>Wegovy/Zepbound prescriptions per 1,000 Medicaid enrollees rose by an estimated 1.3 (95% CI 0.5</text>
<text x='5.48' y='32.09' style='font-size: 14.00px; font-weight: bold;fill: #222222; font-family: "Arial";' textLength='582.58px' lengthAdjust='spacingAndGlyphs'>to 2.1) at coverage start, 11.7 (95% CI 2.8 to 20.7) after 4 quarters and 17.2 (95% CI 7.4 to</text>
<text x='5.48' y='47.21' style='font-size: 14.00px; font-weight: bold;fill: #222222; font-family: "Arial";' textLength='137.67px' lengthAdjust='spacingAndGlyphs'>27.0) after 8 quarters</text>
<text x='5.48' y='457.36' style='font-size: 8.00px;fill: #666666; font-family: "Arial";' textLength='514.78px' lengthAdjust='spacingAndGlyphs'>Simultaneous confidence bands are not shown: with single-state cohorts the bootstrap critical value is unreliable (did warns of this) and very large</text>
<text x='5.48' y='466.00' style='font-size: 8.00px;fill: #666666; font-family: "Arial";' textLength='539.08px' lengthAdjust='spacingAndGlyphs'>(17.9 on average over the imputations, versus 1.96 pointwise). Leads before 2021 Q2 (before Wegovy existed) are omitted: the outcome is mechanically</text>
<text x='5.48' y='474.64' style='font-size: 8.00px;fill: #666666; font-family: "Arial";' textLength='533.45px' lengthAdjust='spacingAndGlyphs'>zero there and they are not evidence of parallel trends. Source: CMS State Drug Utilization Data and Medicaid enrollment (warehouse marts). Gross of</text>
<text x='5.48' y='483.28' style='font-size: 8.00px;fill: #666666; font-family: "Arial";' textLength='164.47px' lengthAdjust='spacingAndGlyphs'>rebates; counts under 11 suppressed by CMS.</text>
