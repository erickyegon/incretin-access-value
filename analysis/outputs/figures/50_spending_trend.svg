<text x='9.96' y='14.29' style='font-size: 13.00px; font-weight: bold;fill: #222222; font-family: "Arial";' textLength='647.80px' lengthAdjust='spacingAndGlyphs'>Gross spending on GLP-1 and GIP products rose from $7.0B in 2020 to $27.5B in 2024 in Medicare Part D</text>
<text x='9.96' y='28.33' style='font-size: 13.00px; font-weight: bold;fill: #222222; font-family: "Arial";' textLength='473.09px' lengthAdjust='spacingAndGlyphs'>and from $1.5B to $8.8B in Medicaid; Ozempic and Mounjaro lead the growth</text>
