<text x='9.96' y='424.83' style='font-size: 7.00px;fill: #666666; font-family: "Arial";' textLength='515.59px' lengthAdjust='spacingAndGlyphs'>Source: CMS Medicare Part D Spending by Drug and Medicaid Spending by Drug (warehouse mart mart_drug_spending_year). Spending is gross of rebates. Orange:</text>
<text x='9.96' y='432.39' style='font-size: 7.00px;fill: #666666; font-family: "Arial";' textLength='499.27px' lengthAdjust='spacingAndGlyphs'>brands labelled for obesity (Wegovy, Zepbound, Saxenda); grey: diabetes brands. Part D brands also include diabetes and other covered uses; Victoza packs are</text>
