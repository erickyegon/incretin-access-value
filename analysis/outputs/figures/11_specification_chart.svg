<text x='5.48' y='46.59' style='font-size: 11.00px;fill: #444444; font-family: "Arial";' textLength='486.89px' lengthAdjust='spacingAndGlyphs'>Overall ATT (simple aggregation) with 95% CI; orange = primary; each other row changes one thing.</text>
<text x='5.48' y='16.97' style='font-size: 14.00px; font-weight: bold;fill: #222222; font-family: "Arial";' textLength='619.12px' lengthAdjust='spacingAndGlyphs'>Estimated average effect on obesity_wz prescriptions per 1,000 enrollees: 12.2 in the primary</text>
<text x='5.48' y='32.09' style='font-size: 14.00px; font-weight: bold;fill: #222222; font-family: "Arial";' textLength='370.20px' lengthAdjust='spacingAndGlyphs'>run, from 10.1 to 14.7 across the 14 other specifications</text>
<text x='5.48' y='480.40' style='font-size: 8.00px;fill: #666666; font-family: "Arial";' textLength='535.67px' lengthAdjust='spacingAndGlyphs'>Specification 12 (fee-for-service only) is not shown: not estimable reliably (FFS denominators too small; coverage operates mainly through MCOs in SC</text>
<text x='5.48' y='489.04' style='font-size: 8.00px;fill: #666666; font-family: "Arial";' textLength='524.48px' lengthAdjust='spacingAndGlyphs'>and RI). It is listed in the specification table. Source: CMS State Drug Utilization Data and Medicaid enrollment (warehouse marts). Gross of rebates;</text>
