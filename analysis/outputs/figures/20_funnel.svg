<text x='10.96' y='560.20' style='font-size: 8.00px;fill: #666666; font-family: "Arial";' textLength='556.03px' lengthAdjust='spacingAndGlyphs'>Sources: NCHS NHANES; KFF Health Tracking Polls (Feb 24-Mar 2, 2026 and Nov 2025); FDA Wegovy and Zepbound labels. Bar widths are proportional to</text>
<text x='10.96' y='568.84' style='font-size: 8.00px;fill: #666666; font-family: "Arial";' textLength='280.66px' lengthAdjust='spacingAndGlyphs'>people. Told-overweight step uses the 2017-2020 file (not asked in 2021-2023).</text>
<text x='10.96' y='60.55' style='font-size: 11.00px;fill: #444444; font-family: "Arial";' textLength='672.33px' lengthAdjust='spacingAndGlyphs'>Solid bars: measured (NHANES 2021-2023 unless stated). Hatched bars: modeled from the KFF Health Tracking Poll (all GLP-1 drugs, all</text>
<text x='10.96' y='72.43' style='font-size: 11.00px;fill: #444444; font-family: "Arial";' textLength='587.23px' lengthAdjust='spacingAndGlyphs'>indications). The eligible count is a lower bound: sleep apnea and other label conditions are not measurable in NHANES.</text>
<text x='10.96' y='15.50' style='font-size: 14.00px; font-weight: bold;fill: #222222; font-family: "Arial";' textLength='585.16px' lengthAdjust='spacingAndGlyphs'>Of 253.8 million U.S. adults, at least 128.8 million (95% CI 117.2 to 140.3) meet the labels'</text>
