<text x='5.48' y='417.04' style='font-size: 8.00px;fill: #666666; font-family: "Arial";' textLength='539.95px' lengthAdjust='spacingAndGlyphs'>Source: CMS Medicare Part D Prescribers by Provider and Drug (rows with at least 11 claims), NPPES. Part D reflects diabetes and other covered uses,</text>
