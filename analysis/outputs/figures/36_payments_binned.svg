<text x='5.48' y='61.71' style='font-size: 11.00px;fill: #444444; font-family: "Arial";' textLength='527.41px' lengthAdjust='spacingAndGlyphs'>Mean 2024 Part D incretin claims (solid) and mean 2022 claims (dashed) by 2023 payment bin: no payment,</text>
<text x='5.48' y='73.59' style='font-size: 11.00px;fill: #444444; font-family: "Arial";' textLength='519.56px' lengthAdjust='spacingAndGlyphs'>then deciles of positive payment amounts (D1 lowest, D10 highest). Binned and aggregate; an association,</text>
<text x='5.48' y='85.47' style='font-size: 11.00px;fill: #444444; font-family: "Arial";' textLength='126.52px' lengthAdjust='spacingAndGlyphs'>not an effect of payments.</text>
<text x='5.48' y='16.97' style='font-size: 14.00px; font-weight: bold;fill: #222222; font-family: "Arial";' textLength='655.72px' lengthAdjust='spacingAndGlyphs'>Prescribers with in-scope payments in 2023 had more incretin claims in 2024 (36.6% of the 199,822</text>
<text x='5.48' y='32.09' style='font-size: 14.00px; font-weight: bold;fill: #222222; font-family: "Arial";' textLength='668.86px' lengthAdjust='spacingAndGlyphs'>prescribers had a payment); adjusted for baseline volume, any payment goes with a claims rate ratio</text>
<text x='5.48' y='47.21' style='font-size: 14.00px; font-weight: bold;fill: #222222; font-family: "Arial";' textLength='374.86px' lengthAdjust='spacingAndGlyphs'>of 1.30 (95% CI 1.29 to 1.31) at the median payee amount</text>
<text x='5.48' y='422.80' style='font-size: 8.00px;fill: #666666; font-family: "Arial";' textLength='537.75px' lengthAdjust='spacingAndGlyphs'>Source: CMS Medicare Part D Prescribers (rows with at least 11 claims) and CMS Open Payments general payments naming in-scope incretin products</text>
<text x='5.48' y='431.44' style='font-size: 8.00px;fill: #666666; font-family: "Arial";' textLength='525.91px' lengthAdjust='spacingAndGlyphs'>(each record counted once, equal split over products). Part D reflects diabetes and other covered uses, not obesity-brand adoption. Association only:</text>
<text x='5.48' y='440.08' style='font-size: 8.00px;fill: #666666; font-family: "Arial";' textLength='133.48px' lengthAdjust='spacingAndGlyphs'>payments are not randomly assigned.</text>
