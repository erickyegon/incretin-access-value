        - generic_name
        - year
- name: mart_nadac_brand_quarter
  description: NADAC acquisition cost per pricing unit by product label and quarter.
  columns:
  - name: brand_label
    description: Brand name, or 'GENERIC <ingredient>' for brand-less generics.
  - name: brand
    description: Brand name, empty for brand-less generics.
  - name: ingredient
    description: Active ingredient.
  - name: product_group
    description: 'Analysis product group: obesity_wz, obesity_saxenda, obesity_other or diabetes_glp1 (combination products are excluded from outcome models).'
  - name: is_combination
    description: True for insulin/GLP-1 combination products (Soliqua, Xultophy).
  - name: pricing_unit
    description: Pricing unit (EA, ML, GM).
  - name: year
    description: Calendar year.
  - name: quarter
    description: Calendar quarter, 1 to 4.
  - name: quarter_label
    description: Quarter as text, for example 2023Q1.
  - name: quarter_start
    description: First day of the quarter.
  - name: n_weekly_ndc_rows
    description: Weekly NDC rows in the quarter.
  - name: n_ndcs
    description: Distinct NDCs.
  - name: n_weeks
    description: Distinct survey weeks.
  - name: nadac_per_unit_mean
    description: Mean NADAC per unit over the rows.
  - name: nadac_per_unit_min
    description: Minimum NADAC per unit.
  - name: nadac_per_unit_max
    description: Maximum NADAC per unit.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - brand_label
        - product_group
        - pricing_unit
        - year
        - quarter
- name: mart_nhanes_adults
  description: NHANES adults aged 18 and over (the adult label population), two cycles stacked, all kept including missing BMI, with design variables, cycle-specific weights, insurance and the condition
    variables used for eligibility.
  columns:
