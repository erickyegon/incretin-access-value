version: 2
models:
- name: mart_did_panel
  description: 'Difference-in-differences panel: 51 states (50 + DC) x 33 quarters = 1,683 rows, with coverage timing, three enrollment denominators and prescription rates per 1,000 in levels.'
  columns:
  - name: state_code
    description: USPS two-letter code of the state (50 states and DC in the panel).
  - name: state_name
    description: State name.
  - name: census_region
    description: Census region of the state.
  - name: census_division
    description: Census division of the state.
  - name: year
    description: Calendar year.
  - name: quarter
    description: Calendar quarter, 1 to 4.
  - name: quarter_label
    description: Quarter as text, for example 2023Q1.
  - name: quarter_start
    description: First day of the quarter.
  - name: is_preliminary
    description: True for SDUD quarters CMS still revises (2026 Q1 at the time of the download).
  - name: analysis_group
    description: primary, sensitivity or never_treated, from the coverage table (primary requires a documented start inside one calendar quarter).
  - name: has_coverage_spell
    description: True when the state has any documented coverage spell.
  - name: covered_days_share
    description: Share of the quarter's days inside a coverage spell, using the latest possible start date (conservative).
  - name: covered_days_share_max
    description: Same share using the earliest possible start date (equal for dated starts).
  - name: coverage_active
    description: True when covered_days_share > 0 (any covered day in the quarter).
  - name: coverage_full_quarter
    description: True when every day of the quarter is covered.
  - name: first_treated_quarter
    description: Quarter containing the first coverage start; NULL when a sensitivity state's start range straddles quarters.
  - name: first_full_quarter
    description: 'First fully covered quarter: the same quarter if coverage starts on its first day, else the next (month-only starts take the next quarter).'
  - name: start_quarter_earliest
    description: Quarter of the earliest possible start date.
  - name: start_quarter_latest
    description: Quarter of the latest possible start date.
  - name: start_precision
    description: 'Precision of the documented start: day, month or range.'
  - name: post_withdrawal
    description: True when the quarter has no covered day after a coverage spell has ended.
  - name: kansas_flag
    description: True for Kansas (primary by decision; the analysis also runs without it).
  - name: category_level_spa
    description: True when the state plan amendment covers the drug category, not Wegovy by name (Mississippi, Tennessee).
  - name: enrollment_medicaid_avg
    description: Quarter average of total Medicaid enrollment (item 8a), the primary denominator; months with no value are skipped.
  - name: n_months_present_medicaid
    description: Months (0 to 3) with a value behind enrollment_medicaid_avg.
  - name: enrollment_medicaid_chip_avg
    description: Quarter average of Medicaid + CHIP enrollment (8a + 8h), sensitivity denominator.
  - name: n_months_present_medicaid_chip
    description: Months (0 to 3) with a value behind enrollment_medicaid_chip_avg.
  - name: enrollment_adult_medicaid_avg
    description: Quarter average of adult Medicaid enrollment (8d + 8g), second sensitivity denominator; reported only from 2024-07.
  - name: n_months_present_adult_medicaid
    description: Months (0 to 3) with a value behind enrollment_adult_medicaid_avg.
  - name: n_months_updated
    description: Months of the quarter taken from the Updated report.
  - name: n_months_preliminary
    description: Months of the quarter taken from the Preliminary report (only where no Updated row exists).
  - name: report_status_used
    description: 'Which enrollment report supplied the months: updated, preliminary or missing.'
  - name: definition_caveat
    description: True when any month of the quarter has a footnote on total Medicaid enrollment that changes the count definition (for example 'not a point-in-time count').
  - name: n_months_definition_caveat
    description: Months of the quarter carrying that footnote.
  - name: definition_caveat_medicaid_chip
    description: Same flag for the Medicaid + CHIP count.
  - name: definition_caveat_adult
    description: Same flag for the adult Medicaid count.
  - name: data_unavailable_note
    description: True when a footnote says the state could not provide data (Rhode Island, 2024-12).
  - name: enrollment_zero_set_null
    description: 'True when a reported zero was set to NULL (Rhode Island): the value stays missing.'
  - name: mc_share
    description: Share of Medicaid enrollees in comprehensive managed care (CMS Managed Care Enrollment Report).
  - name: mc_share_carried_forward
    description: True when mc_share is the 2024 share carried forward to 2025 and 2026 (an assumption).
  - name: enrollment_ffs_medicaid_assumed
    description: 'Medicaid enrollment x (1 - mc_share): the fee-for-service enrollment used by the FFS-only rates (assumption for 2025-2026, see mc_share_carried_forward).'
  - name: sdud_reported_ffsu
    description: False when the state has no SDUD row for any drug in the quarter for fee-for-service utilization (a zero would be false).
  - name: sdud_reported_mcou
    description: False when the state has no SDUD row for any drug in the quarter for managed-care utilization.
  - name: sdud_anomalous
    description: True when the state-quarter all-drug prescription count is below 50% of the median of the four nearest other quarters, for FFSU or MCOU.
  - name: rx_all_drugs_observed
    description: 'All-drug unsuppressed SDUD prescriptions (FFSU + MCOU, every drug) for the state-quarter: context for judging incomplete preliminary data.'
  - name: rx_obesity_wz_tablet_observed
    description: Observed prescriptions (all utilization types) for Wegovy tablets within obesity_wz.
  - name: rx_obesity_wz_observed
    description: Observed prescriptions (FFSU + MCOU, suppressed rows excluded) for Wegovy (injection and tablets) and Zepbound, the exposure group.
  - name: rx_obesity_wz_upper_bound
    description: Observed prescriptions plus 10 per suppressed row for Wegovy (injection and tablets) and Zepbound, the exposure group.
  - name: n_suppressed_rows_obesity_wz
    description: Suppressed SDUD state-NDC rows behind the obesity_wz prescriptions.
  - name: n_rows_obesity_wz
    description: SDUD state-NDC rows behind the obesity_wz prescriptions (0 means no SDUD row for the state-quarter).
  - name: rate_obesity_wz_per_1000_medicaid
    description: 'obesity_wz: observed prescriptions per 1,000 total Medicaid enrollees (primary denominator, level).'
  - name: rate_obesity_wz_upper_bound_per_1000_medicaid
    description: 'obesity_wz: upper-bound prescriptions per 1,000 total Medicaid enrollees (level).'
  - name: rate_obesity_wz_per_1000_medicaid_chip
    description: 'obesity_wz: observed prescriptions per 1,000 Medicaid + CHIP enrollees (sensitivity denominator, level).'
  - name: rate_obesity_wz_per_1000_adult_medicaid
    description: 'obesity_wz: observed prescriptions per 1,000 adult Medicaid enrollees (second sensitivity denominator; NULL before 2024Q3).'
  - name: rate_obesity_wz_ffs_per_1000_ffs_medicaid
    description: 'obesity_wz: FFSU prescriptions per 1,000 assumed fee-for-service Medicaid enrollees (secondary outcome).'
  - name: rx_obesity_saxenda_observed
    description: Observed prescriptions (FFSU + MCOU, suppressed rows excluded) for Saxenda and Saxenda-type generic liraglutide.
  - name: rx_obesity_saxenda_upper_bound
    description: Observed prescriptions plus 10 per suppressed row for Saxenda and Saxenda-type generic liraglutide.
  - name: n_suppressed_rows_obesity_saxenda
    description: Suppressed SDUD state-NDC rows behind the obesity_saxenda prescriptions.
  - name: n_rows_obesity_saxenda
    description: SDUD state-NDC rows behind the obesity_saxenda prescriptions (0 means no SDUD row for the state-quarter).
  - name: rate_obesity_saxenda_per_1000_medicaid
    description: 'obesity_saxenda: observed prescriptions per 1,000 total Medicaid enrollees (primary denominator, level).'
  - name: rate_obesity_saxenda_upper_bound_per_1000_medicaid
    description: 'obesity_saxenda: upper-bound prescriptions per 1,000 total Medicaid enrollees (level).'
  - name: rate_obesity_saxenda_per_1000_medicaid_chip
    description: 'obesity_saxenda: observed prescriptions per 1,000 Medicaid + CHIP enrollees (sensitivity denominator, level).'
  - name: rate_obesity_saxenda_per_1000_adult_medicaid
    description: 'obesity_saxenda: observed prescriptions per 1,000 adult Medicaid enrollees (second sensitivity denominator; NULL before 2024Q3).'
  - name: rate_obesity_saxenda_ffs_per_1000_ffs_medicaid
    description: 'obesity_saxenda: FFSU prescriptions per 1,000 assumed fee-for-service Medicaid enrollees (secondary outcome).'
  - name: rx_obesity_other_observed
    description: Observed prescriptions (FFSU + MCOU, suppressed rows excluded) for other obesity-labelled products (Foundayo).
  - name: rx_obesity_other_upper_bound
    description: Observed prescriptions plus 10 per suppressed row for other obesity-labelled products (Foundayo).
  - name: n_suppressed_rows_obesity_other
    description: Suppressed SDUD state-NDC rows behind the obesity_other prescriptions.
  - name: n_rows_obesity_other
    description: SDUD state-NDC rows behind the obesity_other prescriptions (0 means no SDUD row for the state-quarter).
  - name: rate_obesity_other_per_1000_medicaid
    description: 'obesity_other: observed prescriptions per 1,000 total Medicaid enrollees (primary denominator, level).'
  - name: rate_obesity_other_upper_bound_per_1000_medicaid
    description: 'obesity_other: upper-bound prescriptions per 1,000 total Medicaid enrollees (level).'
  - name: rate_obesity_other_per_1000_medicaid_chip
    description: 'obesity_other: observed prescriptions per 1,000 Medicaid + CHIP enrollees (sensitivity denominator, level).'
  - name: rate_obesity_other_per_1000_adult_medicaid
    description: 'obesity_other: observed prescriptions per 1,000 adult Medicaid enrollees (second sensitivity denominator; NULL before 2024Q3).'
  - name: rate_obesity_other_ffs_per_1000_ffs_medicaid
    description: 'obesity_other: FFSU prescriptions per 1,000 assumed fee-for-service Medicaid enrollees (secondary outcome).'
  - name: rx_diabetes_glp1_observed
    description: Observed prescriptions (FFSU + MCOU, suppressed rows excluded) for diabetes-labelled incretins (not combinations).
  - name: rx_diabetes_glp1_upper_bound
    description: Observed prescriptions plus 10 per suppressed row for diabetes-labelled incretins (not combinations).
  - name: n_suppressed_rows_diabetes_glp1
    description: Suppressed SDUD state-NDC rows behind the diabetes_glp1 prescriptions.
  - name: n_rows_diabetes_glp1
    description: SDUD state-NDC rows behind the diabetes_glp1 prescriptions (0 means no SDUD row for the state-quarter).
  - name: rate_diabetes_glp1_per_1000_medicaid
    description: 'diabetes_glp1: observed prescriptions per 1,000 total Medicaid enrollees (primary denominator, level).'
  - name: rate_diabetes_glp1_upper_bound_per_1000_medicaid
    description: 'diabetes_glp1: upper-bound prescriptions per 1,000 total Medicaid enrollees (level).'
  - name: rate_diabetes_glp1_per_1000_medicaid_chip
    description: 'diabetes_glp1: observed prescriptions per 1,000 Medicaid + CHIP enrollees (sensitivity denominator, level).'
  - name: rate_diabetes_glp1_per_1000_adult_medicaid
    description: 'diabetes_glp1: observed prescriptions per 1,000 adult Medicaid enrollees (second sensitivity denominator; NULL before 2024Q3).'
  - name: rate_diabetes_glp1_ffs_per_1000_ffs_medicaid
    description: 'diabetes_glp1: FFSU prescriptions per 1,000 assumed fee-for-service Medicaid enrollees (secondary outcome).'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - state_code
        - year
        - quarter
- name: mart_sdud_state_quarter_long
  description: 'SDUD for the panel states, long form: state x quarter x utilization type x product group x dosage form, observed and upper-bound measures.'
  columns:
  - name: state_code
    description: USPS two-letter code of the state (50 states and DC in the panel).
  - name: state_name
    description: State name.
  - name: census_region
    description: Census region of the state.
  - name: year
    description: Calendar year.
  - name: quarter
    description: Calendar quarter, 1 to 4.
  - name: quarter_label
    description: Quarter as text, for example 2023Q1.
  - name: quarter_start
    description: First day of the quarter.
  - name: is_preliminary
    description: True for SDUD quarters CMS still revises (2026 Q1 at the time of the download).
  - name: utilization_type
    description: 'SDUD utilization type: FFSU (fee-for-service), MCOU (managed care) or ALL (FFSU + MCOU; never add ALL to the other two).'
  - name: product_group
    description: 'Analysis product group: obesity_wz, obesity_saxenda, obesity_other or diabetes_glp1 (combination products are excluded from outcome models).'
  - name: dosage_form
    description: 'Dosage form group of the NDC: tablet, injection or unknown (no dosage form on record).'
  - name: n_rows
    description: Number of SDUD state-NDC rows behind the cell (suppressed rows included).
  - name: n_suppressed_rows
    description: Number of those rows that CMS suppressed (1 to 10 prescriptions each).
  - name: rx_observed
    description: Prescriptions in the unsuppressed rows only (suppressed rows contribute nothing).
  - name: rx_upper_bound
    description: 'rx_observed + 10 x n_suppressed_rows: the most the cell could hold.'
  - name: units_observed
    description: Units reimbursed in unsuppressed rows.
  - name: units_upper_bound
    description: 'Units upper bound: observed plus, per suppressed row, 10 prescriptions at the highest units-per-prescription seen for that NDC; NULL when units_bound_complete is false.'
  - name: units_bound_complete
    description: True when every suppressed row's NDC has an unsuppressed row to take the per-prescription ratio from.
  - name: amount_total_observed
    description: Total amount reimbursed (Medicaid + non-Medicaid, USD, gross of rebates) in unsuppressed rows.
  - name: amount_total_upper_bound
    description: Upper bound of total amount reimbursed, built like units_upper_bound; NULL when it cannot be bounded.
  - name: amount_medicaid_observed
    description: Medicaid amount reimbursed (USD, gross of rebates) in unsuppressed rows.
  - name: amount_medicaid_upper_bound
    description: Upper bound of the Medicaid amount reimbursed, built like units_upper_bound; NULL when it cannot be bounded.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - state_code
        - year
        - quarter
        - utilization_type
        - product_group
        - dosage_form
- name: mart_sdud_cells_for_imputation
  description: Suppressed SDUD state-NDC cells awaiting imputation, with bounds, national residuals, enrollment and coverage context. Nothing is imputed.
  columns:
  - name: state_code
    description: USPS two-letter code of the state (50 states and DC in the panel).
  - name: ndc11
    description: 11-digit NDC as text.
  - name: year
    description: Calendar year.
  - name: quarter
    description: Calendar quarter, 1 to 4.
  - name: quarter_label
    description: Quarter as text, for example 2023Q1.
  - name: quarter_start
    description: First day of the quarter.
  - name: is_preliminary
    description: True for SDUD quarters CMS still revises (2026 Q1 at the time of the download).
  - name: utilization_type
    description: 'SDUD utilization type: FFSU (fee-for-service), MCOU (managed care) or ALL (FFSU + MCOU; never add ALL to the other two).'
  - name: brand_label
    description: Brand name, or 'GENERIC <ingredient>' for brand-less generics.
  - name: product_group
    description: 'Analysis product group: obesity_wz, obesity_saxenda, obesity_other or diabetes_glp1 (combination products are excluded from outcome models).'
  - name: dosage_form
    description: 'Dosage form group of the NDC: tablet, injection or unknown (no dosage form on record).'
  - name: rx_observed
    description: 'Always NULL: the count is suppressed.'
  - name: rx_lower_bound
    description: 0 (0 to 10 prescriptions treated as possible).
  - name: rx_upper_bound
    description: 10 (the suppression threshold).
  - name: has_national_row
    description: True when the XX national row exists.
  - name: national_suppressed
    description: True when the national row is suppressed.
  - name: national_rx
    description: National prescriptions for the NDC-quarter-type.
  - name: national_state_rx_observed
    description: Observed state prescriptions summed for the NDC-quarter-type (territories included).
  - name: n_suppressed_rows_same_ndc_quarter
    description: Suppressed state rows sharing this NDC, quarter and utilization type (all jurisdictions).
  - name: residual_rx
    description: national_rx minus observed state prescriptions.
  - name: residual_usable
    description: True when the national row is unsuppressed and the residual is positive.
  - name: residual_within_bounds
    description: True when the residual lies between 0 and 10 x the suppressed rows.
  - name: enrollment_medicaid_avg
    description: Quarter average Medicaid enrollment of the state.
  - name: n_months_present_medicaid
    description: Months behind that average.
  - name: analysis_group
    description: primary, sensitivity or never_treated, from the coverage table (primary requires a documented start inside one calendar quarter).
  - name: coverage_active
    description: True when the state covered the obesity drugs on any day of the quarter.
  - name: covered_days_share
    description: Covered share of the quarter (conservative).
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - state_code
        - ndc11
        - year
        - quarter
        - utilization_type
