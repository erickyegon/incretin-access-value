- name: mart_prescriber_year
  description: Medicare Part D prescriber-drug rows (at least 11 claims) with product group, Medicare specialty and NPPES/NUCC taxonomy.
  columns:
  - name: prescriber_npi
    description: Prescriber NPI.
  - name: data_year
    description: Part D data year.
  - name: brand_name
    description: Brand name as published by the source.
  - name: generic_name
    description: Generic name as published by the source.
  - name: product_group
    description: 'Analysis product group: obesity_wz, obesity_saxenda, obesity_other or diabetes_glp1 (combination products are excluded from outcome models).'
  - name: group_basis
    description: 'How the product group was assigned: brand, or generic_name_diabetes when only a generic name was available.'
  - name: prescriber_type
    description: CMS Medicare specialty of the prescriber.
  - name: entity_type_code
    description: 'NPPES entity type: 1 individual, 2 organisation.'
  - name: practice_state
    description: NPPES practice state.
  - name: primary_taxonomy_code
    description: NPPES primary taxonomy code.
  - name: taxonomy_classification
    description: NUCC classification of the primary taxonomy.
  - name: taxonomy_specialization
    description: NUCC specialization of the primary taxonomy.
  - name: in_nppes
    description: True when the NPI is in the NPPES extract.
  - name: prescriber_state
    description: Prescriber state in the Part D file.
  - name: total_claims
    description: Part D claims (at least 11).
  - name: total_30day_fills
    description: 30-day standardized fills.
  - name: total_day_supply
    description: Total days supply.
  - name: total_drug_cost
    description: Total drug cost, USD.
  - name: total_beneficiaries
    description: Beneficiaries with a claim.
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - prescriber_npi
        - data_year
        - brand_name
        - generic_name
- name: mart_open_payments_npi_year
  description: In-scope Open Payments by recipient NPI and program year, for linking to prescribers; aggregate use only.
  columns: []
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - covered_recipient_npi
        - program_year
- name: mart_open_payments_year_product
  description: 'Open Payments by program year, product and physician flag: equal-split and overlapping dollars.'
  columns:
  - name: program_year
    description: Open Payments program year.
  - name: product
    description: In-scope product key from the Open Payments name fields (brand, or ingredient for generic-only names).
  - name: is_physician
    description: True for physician recipients; false for teaching hospitals and non-physician practitioners (NPs and PAs enter in 2021).
  - name: product_group
    description: 'Analysis product group: obesity_wz, obesity_saxenda, obesity_other or diabetes_glp1 (combination products are excluded from outcome models).'
  - name: is_combination
    description: True for insulin/GLP-1 combination products (Soliqua, Xultophy).
  - name: n_records
    description: Records naming the product.
  - name: n_distinct_recipients_npi
    description: Distinct recipient NPIs.
  - name: amount_equal_split
    description: Dollars with each record divided over its in-scope products (sums to the headline total).
  - name: amount_overlapping
    description: Dollars counting the full record for every product named (overlapping; exceeds the headline).
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - program_year
        - product
        - is_physician
